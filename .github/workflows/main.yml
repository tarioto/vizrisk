name: CI

on:
  push:
    branches:
      - master
  pull_request:

# Default to read-only; the deploy job opts into id-token for OIDC.
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: map-app
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          # Angular 10 build toolchain — pinned to the Node it was built against.
          node-version: '12.x'

      - name: Install dependencies
        run: npm install

      - name: Build static files
        run: npm run build:prod

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: map-app/dist/vizrisk/
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::322859817636:role/github-actions-deploy-vizrisk
          aws-region: us-east-1

      - name: Deploy static files to S3 bucket
        run: |
          # index.html + assets + favicon are not fingerprinted — must
          # revalidate so new deploys are picked up. JS/CSS are excluded here
          # so this pass never touches or deletes the hashed bundles.
          aws s3 sync ./dist/ s3://${{ secrets.AWS_S3_BUCKET }} --delete \
            --exclude "*.js" --exclude "*.css" \
            --cache-control "no-cache"
          # Angular fingerprints the JS/CSS bundles (outputHashing: all) —
          # safe to cache forever.
          aws s3 sync ./dist/ s3://${{ secrets.AWS_S3_BUCKET }} --delete \
            --exclude "*" --include "*.js" --include "*.css" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
