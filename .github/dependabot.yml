version: 2
updates:
  # GitHub Actions pinned in .github/workflows/*.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /map-app
    schedule:
      interval: weekly
    groups:
      # Angular framework, CLI and Material packages must move in lockstep.
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
