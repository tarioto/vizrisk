version: 2
updates:
  # GitHub Actions pinned in .github/workflows/*.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  # npm: no automated PRs (version or security). The Angular 10 app in map-app/
  # builds on Node 12 / npm 6, which only reads lockfileVersion 1. Dependabot
  # regenerates package-lock.json as v3, so its npm PRs can't be installed
  # correctly by CI. Security alerts still appear under the Security tab; fix
  # them with npm 6 (`npx npm@6 audit fix`) until the app is upgraded off
  # Angular 10, then remove this ignore rule.
  - package-ecosystem: npm
    directory: /map-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
