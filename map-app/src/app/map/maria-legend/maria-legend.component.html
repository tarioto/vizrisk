<div class="container">
  @for (color of colors; track $index; let i = $index) {
  <div class="row">
    <div [style.background-color]="color" class="square"></div>
    <div style="padding-left: 5px;">
        {{labels[i]}}
      </div>
    </div>
  }
  </div>

@if (labels[0]==='Total number of displaced individuals') {
<div class='container'>
  <div class="row">
    <div class="circle1"></div>
    <span>Greater than 50</span>
  </div>
  <div class="row">
    <div class="circle2"></div>
    <span>Less than 50</span>
  </div>
  <div class="row">
    <div class="circle3"></div>
    <span>Greater than 20</span>
  </div>
  <div class="row">
    <div class="circle4"></div>
    <span>Less than 5</span>
  </div>
</div>
}
